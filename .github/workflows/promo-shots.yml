name: Promo shots
# The promo video's phone screens (mobile/.../screens/PromoTest.kt) against the promo's demo server (.promo/server.py). The PNGs are
# committed back to the branch as .promo/shots/, where .promo/capture.js picks them up, so the video can be made where the Android
# toolchain can't run. Only on claude/* branches or by hand, never on main.
on:
  push:
    branches: ["claude/**"]
    paths: [".promo/server.py", "mobile/app/src/test/kotlin/app/zigora/screens/PromoTest.kt", ".github/workflows/promo-shots.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: Demo server
        run: |
          PROMO_WORK=$RUNNER_TEMP/promo PROMO_PORT=4400 nohup python .promo/server.py > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4400/api/config > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4400/api/config

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Reader page
        working-directory: frontend
        run: npm ci && npm run build:reader

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4

      - name: Shots
        working-directory: mobile
        run: ./gradlew --no-daemon testDebugUnitTest -Pscreens -PscreensServer=http://127.0.0.1:4400 --tests 'app.zigora.screens.PromoTest'

      - name: Commit the shots to the branch
        run: |
          rm -rf .promo/shots && mkdir -p .promo/shots && cp mobile/app/build/screens/promo/*.png .promo/shots/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .promo/shots
          git diff --cached --quiet || { git commit -q -m "Promo shots from PromoTest"; git push -q origin "HEAD:${GITHUB_REF_NAME}"; }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: promo-shots-failure
          path: |
            mobile/app/build/reports/tests
            server.log
          retention-days: 7
