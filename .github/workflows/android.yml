name: Android
# Builds the app in mobile/. On main, and once a day, a new version is published as a GitHub release (tag android-v1.0.N, N = the number of
# commits that changed mobile/ or the web files the app packs in) when there isn't one yet; the Zigora server picks the newest release up for its home page and the app itself.
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml", "frontend/src/reader.jsx", "frontend/src/content.jsx", "frontend/src/highlighter.js", "frontend/src/styles.css", "frontend/src/locales/**", "frontend/reader.html", "frontend/vite.reader.config.js", "frontend/package-lock.json"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yml", "frontend/src/reader.jsx", "frontend/src/content.jsx", "frontend/src/highlighter.js", "frontend/src/styles.css", "frontend/src/locales/**", "frontend/reader.html", "frontend/vite.reader.config.js", "frontend/package-lock.json"]
  schedule:
    - cron: "17 3 * * *"  # once a day (03:17 UTC): publishes the app if a change has not been released yet
  workflow_dispatch:

permissions:
  contents: write  # to publish the release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # the version counts the commits that changed the app

      - name: Version
        id: v
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n=$(git rev-list --count HEAD -- . ../frontend/src/reader.jsx ../frontend/src/content.jsx ../frontend/src/highlighter.js ../frontend/src/styles.css ../frontend/src/locales ../frontend/reader.html ../frontend/vite.reader.config.js)
          echo "code=$n" >> "$GITHUB_OUTPUT"; echo "name=1.0.$n" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if gh release view "android-v1.0.$n" > /dev/null 2>&1; then echo "Version 1.0.$n is already published."; else publish=true; fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$publish" = "false" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Reader page
        if: steps.v.outputs.skip != 'true'
        working-directory: frontend
        run: npm ci && npm run build:reader  # the app shows topic content with the web's own renderer

      - uses: actions/setup-java@v4
        if: steps.v.outputs.skip != 'true'
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.skip != 'true'

      - name: Signing key
        id: key
        if: steps.v.outputs.skip != 'true'
        env: { KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key yet: the APK is built for checking but not published. See mobile/README.md to add one."
          else
            # spaces and line breaks picked up when copying the text are dropped first
            if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/zigora.keystore" 2>/dev/null || [ ! -s "$RUNNER_TEMP/zigora.keystore" ]; then
              echo "::error::ANDROID_KEYSTORE_B64 is not the keystore as base64 text. Make it again with: base64 -w0 zigora.keystore > zigora.keystore.b64 (Mac: base64 -i zigora.keystore -o zigora.keystore.b64) and paste the whole file."
              exit 1
            fi
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.v.outputs.skip != 'true'
        env:
          ZIGORA_KEYSTORE: "${{ steps.key.outputs.ok == 'true' && format('{0}/zigora.keystore', runner.temp) || '' }}"
          ZIGORA_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ZIGORA_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ZIGORA_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: >
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease
          -PzigoraVersionCode=${{ steps.v.outputs.code }} -PzigoraVersionName=${{ steps.v.outputs.name }} -PzigoraServer="${{ vars.ZIGORA_SERVER }}"

      - name: Name the APK
        if: steps.v.outputs.skip != 'true'
        run: cp app/build/outputs/apk/release/app-release.apk "zigora-${{ steps.v.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        if: steps.v.outputs.skip != 'true'
        with:
          name: zigora-${{ steps.v.outputs.name }}
          path: mobile/zigora-${{ steps.v.outputs.name }}.apk
          retention-days: 14

      - name: Publish
        if: steps.v.outputs.publish == 'true' && steps.key.outputs.ok == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "android-v${{ steps.v.outputs.name }}" "zigora-${{ steps.v.outputs.name }}.apk" --target "${{ github.sha }}" \
            --title "Zigora for Android ${{ steps.v.outputs.name }}" \
            --notes "Zigora for Android ${{ steps.v.outputs.name }}, built from $(git rev-parse --short HEAD). Android 13 or later. Install it, or open the app's update note, to get this version."
