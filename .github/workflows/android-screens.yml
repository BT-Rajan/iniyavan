name: Android screens
# Runs the app's onboarding and MCQ screens (mobile/app/src/test/.../screens/OnboardingTest.kt, McqTest.kt, AccountTest.kt) on a simulated phone (Robolectric) against a Zigora
# server seeded by mobile/screens_seed.py, and keeps a screenshot of each screen as the "onboarding-screens" artifact.
on:
  pull_request:
    paths: ["mobile/**", "backend/main.py", "frontend/src/locales/**", ".github/workflows/android-screens.yml"]
  workflow_dispatch:

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: Seeded server
        run: |
          nohup python mobile/screens_seed.py > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5299/api/config > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:5299/api/config

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Reader page
        working-directory: frontend
        run: npm ci && npm run build:reader  # the app packs the web's renderer for topic content

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4

      - name: Screens
        working-directory: mobile
        run: ./gradlew --no-daemon testDebugUnitTest -Pscreens --tests 'app.zigora.screens.OnboardingTest' --tests 'app.zigora.screens.McqTest' --tests 'app.zigora.screens.AccountTest'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-screens
          path: |
            mobile/app/build/screens
            mobile/app/build/reports/tests
            server.log
          retention-days: 14
